<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="zooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#zooGrad)" opacity="0.15"/>
  <!-- Z letter -->
  <text x="50" y="68" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="url(#zooGrad)" text-anchor="middle" filter="url(#glow)">Z</text>
  <!-- Eye dots -->
  <circle cx="35" cy="42" r="3" fill="#ec4899"/>
  <circle cx="65" cy="42" r="3" fill="#06b6d4"/>
</svg>
