<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="40%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="eyeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="eyeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="halo" cx="50%" cy="45%" r="40%">
      <stop offset="0%" style="stop-color:#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" style="stop-color:#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Halo -->
  <circle cx="256" cy="230" r="180" fill="url(#halo)"/>
  
  <!-- Z Letter - Main -->
  <text x="256" y="310" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="280" font-weight="900" fill="url(#zGrad)" text-anchor="middle" filter="url(#shadow)">Z</text>
  
  <!-- Left Eye -->
  <circle cx="195" cy="200" r="22" fill="url(#eyeLeft)" filter="url(#glow)"/>
  <circle cx="195" cy="200" r="8" fill="white" opacity="0.9"/>
  <circle cx="191" cy="196" r="3" fill="white"/>
  
  <!-- Right Eye -->
  <circle cx="317" cy="200" r="22" fill="url(#eyeRight)" filter="url(#glow)"/>
  <circle cx="317" cy="200" r="8" fill="white" opacity="0.9"/>
  <circle cx="313" cy="196" r="3" fill="white"/>
  
  <!-- Subtle ZOO text -->
  <text x="256" y="420" font-family="Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="300" fill="white" text-anchor="middle" opacity="0.6" letter-spacing="12">ZOO</text>
</svg>
