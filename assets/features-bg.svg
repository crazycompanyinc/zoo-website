<!-- SVG Procedural Backgrounds - High quality, zero external requests -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#00e5ff" stop-opacity="0.08"/><stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="30%" cy="70%" r="60%"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.06"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>
  <rect fill="#06060a" width="1920" height="1080"/>
  <circle cx="960" cy="540" r="500" fill="url(#g1)" filter="url(#blur1)"/>
  <circle cx="400" cy="800" r="400" fill="url(#g2)" filter="url(#blur1)"/>
  <!-- Grid lines -->
  <g stroke="#00e5ff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/><line x1="0" y1="540" x2="1920" y2="540"/><line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/><line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  <!-- Floating nodes -->
  <g fill="#00e5ff" opacity="0.15">
    <circle cx="300" cy="200" r="4"/><circle cx="800" cy="150" r="3"/><circle cx="1200" cy="300" r="5"/>
    <circle cx="1600" cy="200" r="3"/><circle cx="500" cy="700" r="4"/><circle cx="1000" cy="800" r="3"/>
    <circle cx="1500" cy="600" r="5"/><circle cx="200" cy="500" r="3"/><circle cx="1700" cy="900" r="4"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#00e5ff" stroke-opacity="0.04" stroke-width="1">
    <line x1="300" y1="200" x2="800" y2="150"/><line x1="800" y1="150" x2="1200" y2="300"/>
    <line x1="1200" y1="300" x2="1600" y2="200"/><line x1="500" y1="700" x2="1000" y2="800"/>
    <line x1="1000" y1="800" x2="1500" y2="600"/><line x1="200" y1="500" x2="500" y2="700"/>
  </g>
</svg>